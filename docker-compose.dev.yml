version: '3.8'

# Docker Compose для разработки с hot-reload (опционально)
# Использование: docker-compose -f docker-compose.dev.yml up

services:
  bot:
    build:
      context: ./bot
      dockerfile: ../docker/bot/Dockerfile.dev
    volumes:
      - ./bot:/app
      - db_data:/data
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - MIN_FACES=${MIN_FACES:-4}
      - MAX_FACES=${MAX_FACES:-6}
      - VOTING_TEXT=${VOTING_TEXT:-кто тут у нас самый улыбчивый}
      - VOTING_DURATION=${VOTING_DURATION:-5m}
      - DB_PATH=/data/bot.db

  admin:
    build:
      context: ./admin
      dockerfile: ../docker/admin/Dockerfile.dev
    volumes:
      - ./admin:/app
      - db_data:/data
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    environment:
      - ADMIN_PORT=8080
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - ADMIN_DB_PATH=/data/bot.db

volumes:
  db_data:

